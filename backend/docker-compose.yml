# docker-compose.yml
#
# This file is ONLY for local development.
# It lets you run the entire backend stack with one command:
#   docker compose up --build
#
# Render does NOT use this file.
# Render builds and runs the container using the Dockerfile directly
# (configured in render.yaml).

version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PLANT_ID_API_KEY=${PLANT_ID_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RATE_LIMIT=10/minute
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
