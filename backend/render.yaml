# Render Blueprint (render.yaml)
#
# This file tells Render how to build and run your service.
# It is the single source of truth for infrastructure.
#
# After pushing this file, Render will:
#   1. Build a Docker image using backend/Dockerfile
#   2. Run the resulting container
#   3. Inject the environment variables listed below

services:
  - type: web
    name: plant_id_proxy
    runtime: docker                    # Use Docker (not the native Python builder)
    region: oregon
    plan: free

    # Path to the Dockerfile relative to the repository root
    dockerfilePath: backend/Dockerfile

    # IMPORTANT: Use the backend/ folder as the Docker build context
    # so that COPY requirements.txt . and COPY . . work correctly.
    dockerContext: backend

    # Environment variables
    # Secrets are marked with sync: false so their values live only in the dashboard
    envVars:
      - key: PLANT_ID_API_KEY
        sync: false                    # Secret – set in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false                    # Secret – set in Render dashboard
      - key: RATE_LIMIT
        value: "10/minute"             # Default rate limit (can be overridden)