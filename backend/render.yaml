services:
  - type: web
    name: plant_id_proxy
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLANT_ID_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
